<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NovaULTRA AI Assistant</title>
<style>
  :root { --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --accent: #38bdf8; --user: #3b82f6; --ai: #334155; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { display: flex; font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; }
  #sidebar { position: fixed; top: 0; left: -300px; width: 300px; height: 100dvh; background: var(--panel); z-index: 100; transition: 0.3s ease; display: flex; flex-direction: column; padding: 20px 15px; border-right: 1px solid #334155; overflow-y: auto; }
  #sidebar.open { left: 0; box-shadow: 10px 0 50px rgba(0,0,0,0.5); }
  #overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0,0,0,0.6); z-index: 90; display: none; opacity: 0; transition: 0.3s; }
  #overlay.open { display: block; opacity: 1; }
  .menu-title { font-size: 20px; color: var(--accent); font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
  .menu-btn { background: #0f172a; border: 1px solid #334155; color: white; padding: 10px 12px; border-radius: 10px; margin-bottom: 6px; text-align: left; font-size: 13px; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
  .menu-btn.active { background: var(--accent); color: #0f172a; font-weight: bold; border-color: var(--accent); }
  .menu-btn:hover { border-color: var(--accent); }
  .personality-box { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px; margin-bottom: 15px; }
  .personality-box label { font-size: 12px; color: var(--accent); display: block; margin-bottom: 5px; }
  .personality-box textarea { width: 100%; height: 60px; background: transparent; border: none; color: white; resize: none; outline: none; font-family: inherit; font-size: 13px; }
  #main { flex: 1; display: flex; flex-direction: column; width: 100%; }
  header { padding: 12px 15px; background: var(--panel); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
  .header-left { display: flex; align-items: center; gap: 15px; }
  #hamburger { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
  .title-area h1 { font-size: 16px; color: var(--accent); }
  .title-area p { font-size: 11px; color: #94a3b8; }
  .weather-box { text-align: right; font-size: 13px; color: #cbd5e1; }
  .weather-box span { display: block; font-weight: bold; color: var(--accent); font-size: 16px; }
  #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 90%; padding: 12px; border-radius: 12px; font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { background: var(--user); align-self: flex-end; border-bottom-right-radius: 2px; }
  .msg.ai { background: var(--ai); align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #475569; }
  .msg.ai code { background: #0f172a; padding: 2px 6px; border-radius: 4px; font-family: monospace; color: #38bdf8; }
  footer { padding: 12px; background: var(--panel); display: flex; gap: 8px; border-top: 1px solid #334155; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  input { flex: 1; padding: 12px; border-radius: 24px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 15px; outline: none; }
  button.send { background: var(--accent); border: none; border-radius: 50%; width: 46px; height: 46px; font-size: 18px; color: #0f172a; cursor: pointer; font-weight: bold; }
  .typing::after { content: '...'; animation: dots 1.5s infinite; }
  @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60%, 100% { content: '...'; } }
</style>
</head>
<body>
<div id="overlay" onclick="toggleMenu()"></div>
<div id="sidebar">
  <div class="menu-title">Modlar <span style="cursor:pointer;" onclick="toggleMenu()">✖</span></div>
  <div class="personality-box">
    <label>🎭 Kişilik Özelliği</label>
    <textarea id="personality-input" placeholder="Örn: Bana alaycı bir dille cevap ver..."></textarea>
  </div>
  <button class="menu-btn" onclick="yeniSohbet()">🗑️ Sohbeti Temizle</button>
  <button class="menu-btn" id="btn-mixed" onclick="modSec('mixed')">🌟 Ortaya Karışık</button>
  <button class="menu-btn active" id="btn-normal" onclick="modSec('normal')">🤖 Normal Sohbet</button>
  <button class="menu-btn" id="btn-satranc" onclick="modSec('satranc')">♟️ Satranç Ustası</button>
  <button class="menu-btn" id="btn-math" onclick="modSec('math')">📐 Matematik</button>
  <button class="menu-btn" id="btn-code" onclick="modSec('code')">💻 Kod Yazma</button>
  <button class="menu-btn" id="btn-edebiyat" onclick="modSec('edebiyat')">📚 Edebiyat</button>
  <button class="menu-btn" id="btn-felsefe" onclick="modSec('felsefe')">🧠 Felsefe</button>
  <button class="menu-btn" id="btn-tarih" onclick="modSec('tarih')">🏛️ Tarih</button>
  <button class="menu-btn" id="btn-osmanli" onclick="modSec('osmanli')">📜 Osmanlı Türkçesi</button>
  <button class="menu-btn" id="btn-dil" onclick="modSec('dil')">🌍 Yabancı Dil</button>
  <div style="margin-top: auto; padding-top: 15px; font-size: 12px; color: #94a3b8; text-align: center;">Aktif Mod: <span id="active-mode-text" style="color:var(--accent);">Normal</span></div>
</div>
<div id="main">
  <header>
    <div class="header-left">
      <button id="hamburger" onclick="toggleMenu()">☰</button>
      <div class="title-area"><h1>NovaULTRA AI Assistant</h1><p id="clock-text">--:--</p></div>
    </div>
    <div class="weather-box" id="weather-text">Hava...</div>
  </header>
  <div id="chat"></div>
  <footer>
    <input id="inp" placeholder="Mesajını yaz..." autocomplete="off">
    <button class="send" id="send">➤</button>
  </footer>
</div>
<script>
  let currentMode = 'normal'; 
  let sohbetGecmisi = JSON.parse(localStorage.getItem('novaHistory')) || [];
  function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('open'); }
  function yeniSohbet() { if(confirm("Sohbet geçmişi silinecek. Emin misin?")) { sohbetGecmisi = []; localStorage.removeItem('novaHistory'); document.getElementById('chat').innerHTML = ''; ekleMesaj('ai', 'Hafıza temizlendi.', false); toggleMenu(); } }
  function modSec(mod) {
    currentMode = mod;
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + mod).classList.add('active');
    const modIsimleri = { 'normal': 'Normal', 'mixed': 'Ortaya Karışık', 'math': 'Matematik', 'code': 'Kodlama', 'edebiyat': 'Edebiyat', 'felsefe': 'Felsefe', 'tarih': 'Tarih', 'osmanli': 'Osmanlı Türkçesi', 'dil': 'Yabancı Dil', 'satranc': 'Satranç Ustası' };
    document.getElementById('active-mode-text').innerText = modIsimleri[mod];
    ekleMesaj('ai', `Mod değişti: **${modIsimleri[mod]}**.`); toggleMenu();
  }
  function ekleMesaj(kim, metin, kaydet = true) {
    const chat = document.getElementById('chat'); const div = document.createElement('div');
    div.className = 'msg ' + kim;
    div.innerHTML = metin.replace(/```([\s\S]*?)```/g, '<br><code>$1</code><br>').replace(/`([^`]+)`/g, '<code>$1</code>');
    chat.appendChild(div); chat.scrollTop = chat.scrollHeight; 
    if(kaydet) { sohbetGecmisi.push({ role: kim === 'user' ? 'user' : 'assistant', content: metin }); localStorage.setItem('novaHistory', JSON.stringify(sohbetGecmisi)); }
    return div;
  }
  async function gonder() {
    const inp = document.getElementById('inp'); const text = inp.value.trim(); if (!text) return;
    ekleMesaj('user', text); inp.value = ''; 
    const personality = document.getElementById('personality-input').value;
    const yukleniyorDiv = ekleMesaj('ai', '<span class="typing">NovaULTRA düşünüyor</span>', false);
    try {
      const response = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: sohbetGecmisi.slice(0, -1), mode: currentMode, personality: personality }) });
      const data = await response.json(); yukleniyorDiv.remove();
      if (data.choices && data.choices[0]) { ekleMesaj('ai', data.choices[0].message.content); } 
      else { ekleMesaj('ai', `Hata: ${data.error || 'Bilinmeyen sorun'}`, false); }
    } catch (err) { yukleniyorDiv.remove(); ekleMesaj('ai', 'Sunucuya bağlanamadım.', false); }
  }
  document.getElementById('send').onclick = gonder; document.getElementById('inp').addEventListener('keydown', e => { if (e.key === 'Enter') gonder(); });
  setInterval(() => { const n = new Date(); document.getElementById('clock-text').textContent = String(n.getHours()).padStart(2, "0") + ":" + String(n.getMinutes()).padStart(2, "0"); }, 1000);
  if(navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(async pos => {
          try {
              const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current_weather=true`);
              const d = await r.json();
              document.getElementById('weather-text').innerHTML = `🌡️ ${Math.round(d.current_weather.temperature)}°C<br><span style="font-size:10px;color:#94a3b8">Konumunuz</span>`;
          } catch(e) { document.getElementById('weather-text').innerText = "Hava alınamadı"; }
      }, () => { document.getElementById('weather-text').innerText = "Konum izni yok"; });
  }
  if(sohbetGecmisi.length > 0) { sohbetGecmisi.forEach(msg => ekleMesaj(msg.role === 'user' ? 'user' : 'ai', msg.content, false)); } 
  else { ekleMesaj('ai', 'Merhaba! Ben **NovaULTRA AI Assistant**. Menüden mod seçebilir, kişiliğimi ayarlayabilirsin.', false); }
</script>
</body>
</html>
